[build-system]
requires = ["setuptools>=61.0.0,<68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "materialxpb"
version = "1.39.4"
authors = [
  { name="Bernard Kwok", email="kwokcb@gmail.com" },
]
description = "Bidirectional conversion utilities for MaterialX and Google Protobuf"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "materialx>=1.39.4", 
    "protobuf>=6.33.0"
]
[project.optional-dependencies]
dev = [
    "pytest",
    "json",
    "mypy>=1.0.0"
]

[tool.setuptools]
py-modules = ["main", "materialx_serializer", "materialx_pb2"]
package-dir = {"" = "source"}

[tool.setuptools.package-data]
"*" = ["data/*.*", "*.pyi"]

[project.scripts]
materialxpb = "main:main"

[project.urls]
"Homepage" = "https://kwokcb.github.io/materialxpb/"
"Issues" = "https://github.com/kwokcb/materialxpb/issues"
"Source Code" = "https://github.com/kwokcb/materialxpb"
"Documentation" = "https://kwokcb.github.io/materialxpb/"
